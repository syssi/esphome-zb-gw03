switch:
  - platform: template
    id: zigbee_pairing_mode
    name: "Toggle pairing mode"
    turn_on_action:
      - switch.turn_on: download_mode
      - delay: 5s
      - switch.turn_off: download_mode

binary_sensor:
  - platform: gpio
    name: "Enable Pairing Mode"
    internal: true
    pin:
      number: GPIO34
      inverted: true
    on_press:
      - switch.turn_on: download_mode
      - delay: 5s
      - switch.turn_off: download_mode
